# Yuki Reader 反向代理：对外只暴露 80，后端 8080 绑本机回环
# 使用方式：
#   sudo cp nginx-yuki-reader.conf /etc/nginx/sites-available/yuki-reader
#   sudo ln -s /etc/nginx/sites-available/yuki-reader /etc/nginx/sites-enabled/yuki-reader
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name 49.235.122.72;

    # 上传 TXT 书籍，放宽体积限制
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 翻译可能较慢，放宽等待
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
